<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Shaka MPEG-DASH Player</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
  <style>
    body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
    video { width: 90vw; height: 90vh; background: #000; }
  </style>
</head>
<body>
  <video id="video" autoplay controls></video>
  <script>
    async function initPlayer() {
      const video = document.getElementById('video');
      const player = new shaka.Player(video);

      player.addEventListener('error', (e) => console.error('Shaka error:', e));

      const mpdUrl = "https://jatin-0-7.github.io/intro/eiltebeam.mpd";

      try {
        await player.load(mpdUrl);
        console.log("Video loaded successfully!");
      } catch (e) {
        console.error("Error loading video:", e);
      }
    }

    document.addEventListener('DOMContentLoaded', initPlayer);
  </script>
</body>
</html>
