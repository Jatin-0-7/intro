<!DOCTYPE html>
<html>
<head>
  <title>Portal Config Dashboard</title>
  <meta charset="UTF-8" />
  <style>
    body { font-family: Arial; background: #111; color: white; padding: 20px; }
    input, button {
      width: 100%; padding: 10px; margin: 10px 0;
      background: #222; color: white; border: 1px solid #555;
    }
    button { background: #007bff; }
  </style>
</head>
<body>
  <h1>Update Portal Settings</h1>
  <input id="portal" placeholder="Portal URL (e.g. http://tv.max4k.us)">
  <input id="mac" placeholder="MAC Address">
  <input id="sn" placeholder="Serial Number">
  <input id="device" placeholder="Device ID">
  <button onclick="save()">💾 Save</button>
  <p id="status"></p>

  <script>
    const fileURL = 'https://api.github.com/repos/Jatin-0-7/intro/contents/config/settings.json';
    const token = 'ghp_xxx'; // <-- Replace this with a **GitHub Token**

    async function getSha() {
      const res = await fetch(fileURL, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const json = await res.json();
      return json.sha;
    }

    async function save() {
      const data = {
        portal: document.getElementById('portal').value,
        mac: document.getElementById('mac').value,
        sn: document.getElementById('sn').value,
        device: document.getElementById('device').value
      };

      const content = btoa(JSON.stringify(data, null, 2));
      const sha = await getSha();

      const res = await fetch(fileURL, {
        method: 'PUT',
        headers: {
          Authorization: `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: "Update portal settings",
          content,
          sha
        })
      });

      const result = await res.json();
      document.getElementById("status").innerText = res.ok ? "✅ Saved!" : `❌ Error: ${result.message}`;
    }
  </script>
</body>
</html>
